name: Release

# release-please keeps a release PR open on main from the conventional
# commits; merging it tags a version. The build matrix makes one archive per
# platform with a read-only token (it runs every dependency's build script);
# publish then attests their build provenance and attaches them to the
# release, and verify-install runs the install scripts against it on each OS.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build assets for, e.g. v0.1.0"
        required: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: rust

  build:
    name: Build ${{ matrix.settings.target }}
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.settings.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # Static musl builds run on any Linux, whatever its glibc
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: .exe
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      TARGET: ${{ matrix.settings.target }}
      EXE: ${{ matrix.settings.exe }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Install musl tools
        if: contains(matrix.settings.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cargo-about
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-about

      - name: Build binary
        shell: bash
        run: |
          if [[ "$TARGET" == *musl* ]]; then
            # ring's C code compiles with musl-gcc on the native-arch runner
            export "CC_${TARGET//-/_}=musl-gcc"
          fi
          cargo build --release --locked --target "$TARGET"

      - name: Smoke test
        shell: bash
        run: '"target/$TARGET/release/geekcli$EXE" --version'

      - name: Package
        id: archive
        shell: bash
        run: |
          NAME="geekcli-${TAG}-${TARGET}"
          mkdir -p "dist/$NAME"
          cp "target/$TARGET/release/geekcli$EXE" README.md LICENSE docs/GUIDE.md "dist/$NAME/"
          cargo about generate --locked --fail about.hbs > "dist/$NAME/THIRD_PARTY_LICENSES.html"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARCHIVE="$NAME.zip"
            (cd dist && 7z a -tzip "../$ARCHIVE" "$NAME" >/dev/null)
          else
            ARCHIVE="$NAME.tar.gz"
            tar -czf "$ARCHIVE" -C dist "$NAME"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          cat "$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Keep the archive for publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.archive.outputs.archive }}
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
          if-no-files-found: error

  publish:
    name: Attest and publish
    needs: [release-please, build]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the archives to the release
      id-token: write # sign the provenance attestation
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber "$TAG" dist/* -R "$GITHUB_REPOSITORY"

  verify-install:
    name: Install on ${{ matrix.os }}
    needs: [release-please, publish]
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          export GEEKCLI_INSTALL_DIR="$RUNNER_TEMP/bin"
          sh install.sh --version "$TAG"
          "$GEEKCLI_INSTALL_DIR/geekcli" --version | grep -F "${TAG#v}"

      - name: install.sh piped (the documented curl | sh path)
        if: runner.os != 'Windows'
        run: |
          # The flag forms that survive a pipe, since `| sh --version X` would
          # hand the flag to sh and install nothing.
          export GEEKCLI_INSTALL_DIR="$RUNNER_TEMP/bin-piped"
          cat install.sh | sh -s -- --version "$TAG"
          "$GEEKCLI_INSTALL_DIR/geekcli" --version | grep -F "${TAG#v}"

          export GEEKCLI_INSTALL_DIR="$RUNNER_TEMP/bin-env"
          cat install.sh | GEEKCLI_VERSION="$TAG" sh
          "$GEEKCLI_INSTALL_DIR/geekcli" --version | grep -F "${TAG#v}"

          cat install.sh | sh -s -- --help | grep -F 'GEEKCLI_VERSION'

      - name: Linux binary runs on an older glibc and on Alpine
        if: runner.os == 'Linux'
        run: |
          for image in debian:11 alpine:3; do
            docker run --rm -v "$RUNNER_TEMP/bin:/b:ro" "$image" /b/geekcli --version
          done

      - name: Provenance verifies
        if: runner.os == 'Linux'
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "geekcli-$TAG-x86_64-unknown-linux-musl.tar.gz" -D "$RUNNER_TEMP/dl"
          gh attestation verify "$RUNNER_TEMP/dl/geekcli-$TAG-x86_64-unknown-linux-musl.tar.gz" -R "$GITHUB_REPOSITORY"

      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GEEKCLI_INSTALL_DIR = "$env:RUNNER_TEMP\bin"
          ./install.ps1 -Version $env:TAG
          $out = & "$env:GEEKCLI_INSTALL_DIR\geekcli.exe" --version
          if ($out -notmatch [regex]::Escape($env:TAG.TrimStart('v'))) { throw "unexpected version: $out" }

      - name: install.ps1 through iex (the documented irm | iex path)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # iex passes no arguments, so the version has to arrive in the
          # environment or through a scriptblock.
          $env:GEEKCLI_INSTALL_DIR = "$env:RUNNER_TEMP\bin-iex"
          $env:GEEKCLI_VERSION = $env:TAG
          Get-Content -Raw ./install.ps1 | Invoke-Expression
          $out = & "$env:GEEKCLI_INSTALL_DIR\geekcli.exe" --version
          if ($out -notmatch [regex]::Escape($env:TAG.TrimStart('v'))) { throw "unexpected version: $out" }

          Remove-Item Env:GEEKCLI_VERSION
          $env:GEEKCLI_INSTALL_DIR = "$env:RUNNER_TEMP\bin-block"
          & ([scriptblock]::Create((Get-Content -Raw ./install.ps1))) -Version $env:TAG
          $out = & "$env:GEEKCLI_INSTALL_DIR\geekcli.exe" --version
          if ($out -notmatch [regex]::Escape($env:TAG.TrimStart('v'))) { throw "unexpected version: $out" }
