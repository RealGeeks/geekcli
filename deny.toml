# cargo-deny: run in CI by the Quality workflow (`cargo deny check`).

[graph]
all-features = false

[advisories]
# RustSec advisories fail the build; unmaintained crates are reported too.
yanked = "deny"

[licenses]
# Permissive licenses compatible with distributing MIT-licensed binaries.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
]
confidence-threshold = 0.9

# headless_chrome generates its Chrome DevTools Protocol bindings at build
# time with this GPL-3.0 tool. It is a build-dependency only: none of its code
# is linked into the geekcli binary (THIRD_PARTY_LICENSES.html leaves build
# dependencies out for the same reason).
[[licenses.exceptions]]
crate = "auto_generate_cdp"
allow = ["GPL-3.0-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
